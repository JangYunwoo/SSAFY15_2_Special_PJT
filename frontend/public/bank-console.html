<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SSAFY 뱅크</title>
  <style>
    :root {
      --blue:#3182f6; --ink:#191f28; --sub:#8b95a1; --line:#f2f4f6; --field:#f2f4f6;
      --bg:#ffffff; --screen:#f9fafb; --pos:#3182f6; --neg:#191f28;
    }
    * { box-sizing:border-box; }
    body {
      margin:0; color:var(--ink);
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
      background:#e5e8eb; min-height:100vh; display:flex; justify-content:center; align-items:center; padding:24px;
    }
    /* 폰 목업 */
    .phone {
      position:relative; width:400px; max-width:100%; height:840px; max-height:calc(100vh - 48px);
      background:var(--bg); border:12px solid #191f28; border-radius:48px; overflow:hidden;
      box-shadow:0 30px 80px rgba(0,0,0,.28);
    }
    .phone::before { content:''; position:absolute; top:0; left:50%; transform:translateX(-50%);
      width:130px; height:24px; background:#191f28; border-radius:0 0 16px 16px; z-index:10; }
    .phone-screen { height:100%; overflow-y:auto; background:var(--screen); }
    .phone-screen::-webkit-scrollbar { width:0; }
    header {
      position:sticky; top:0; z-index:5; padding:40px 20px 14px; background:var(--bg);
      display:flex; align-items:center; gap:8px; border-bottom:1px solid var(--line);
    }
    header .logo { font-weight:800; font-size:18px; letter-spacing:-.5px; }
    header .who { margin-left:auto; font-size:13px; color:var(--sub); font-weight:600; }
    header .pop { background:none; border:0; color:var(--sub); font-size:18px; cursor:pointer; padding:4px; }
    main { padding:20px; }
    h2 { margin:0 0 2px; font-size:17px; font-weight:700; letter-spacing:-.3px; }
    .muted { color:var(--sub); font-size:13px; line-height:1.5; }
    .card { background:var(--bg); border-radius:20px; padding:22px; margin-bottom:14px; box-shadow:0 2px 12px rgba(0,0,0,.04); }
    label { display:block; font-size:13px; color:var(--sub); margin:14px 0 6px; font-weight:600; }
    input {
      background:var(--field); border:0; border-radius:12px; padding:14px 14px; color:var(--ink);
      font-size:15px; width:100%; outline:none;
    }
    input:focus { box-shadow:0 0 0 2px var(--blue) inset; }
    button {
      background:var(--blue); color:#fff; border:0; border-radius:14px; padding:14px 18px;
      font-size:15px; font-weight:700; cursor:pointer; letter-spacing:-.3px;
    }
    button.block { width:100%; }
    button.ghost { background:var(--field); color:var(--ink); }
    button.small { padding:9px 14px; font-size:13px; border-radius:10px; }
    button:disabled { opacity:.4; cursor:not-allowed; }
    .row { display:flex; gap:8px; align-items:center; }
    .amount { font-size:30px; font-weight:800; letter-spacing:-1.2px; }
    .label-s { font-size:13px; color:var(--sub); font-weight:600; }
    .tx { display:flex; align-items:center; justify-content:space-between; padding:14px 0; border-top:1px solid var(--line); }
    .tx:first-of-type { border-top:0; }
    .tx .t-main { font-size:14px; font-weight:600; }
    .tx .t-sub { font-size:12px; color:var(--sub); margin-top:2px; }
    .tx .t-amt { font-size:15px; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:-.3px; }
    .in { color:var(--pos); } .out { color:var(--neg); }
    .err { color:#f04452; font-size:13px; margin-top:10px; }
    .hide { display:none; }
    .empty { color:var(--sub); font-size:13px; padding:20px 0; text-align:center; }
    /* 카드 비주얼 (다크, 깔끔) */
    .cardface { background:#4e5968; color:#fff; border-radius:16px; padding:20px; display:flex; flex-direction:column; gap:14px; }
    .cardface .c-brand { font-size:13px; opacity:.85; font-weight:600; }
    .cardface .c-no { font-size:19px; font-weight:700; letter-spacing:2px; font-variant-numeric:tabular-nums; }
    .cardface .c-meta { display:flex; gap:22px; font-size:13px; }
    .cardface .c-meta b { font-weight:700; }
    .hint { margin-top:12px; font-size:12px; color:var(--sub); background:var(--field); border-radius:10px; padding:10px 12px; }
    .sec-gap { height:8px; }
    /* 팝업(폰 크기 창)에서는 창 자체가 폰이므로 목업 베젤 제거 */
    body.phone-mode { padding:0; align-items:stretch; background:var(--screen); }
    body.phone-mode .phone { width:100%; height:100vh; max-height:none; border:none; border-radius:0; box-shadow:none; }
    body.phone-mode .phone::before { display:none; }
    body.phone-mode header { padding-top:18px; }
    body.phone-mode .pop { display:none; }
  </style>
</head>
<body>
  <div class="phone" id="phone">
    <div class="phone-screen">
      <header>
        <span class="logo">SSAFY 뱅크</span>
        <span class="who" id="who"></span>
        <button class="pop" id="openPhone" title="폰 창으로 열기">⤢</button>
      </header>
      <main>
        <!-- 로그인 -->
        <section class="card" id="loginCard">
          <h2>로그인</h2>
          <p class="muted">공구한 계정으로 로그인하면 내 카드·계좌를 볼 수 있어요.</p>
          <label>이메일</label>
          <input id="email" placeholder="you@example.com" autocomplete="username" />
          <label>비밀번호</label>
          <input id="password" type="password" placeholder="비밀번호" autocomplete="current-password" />
          <input id="apiBase" type="hidden" value="" />
          <button class="block" id="loginBtn" style="margin-top:20px;">로그인</button>
          <div class="err" id="loginErr"></div>
        </section>

        <!-- 대시보드 -->
        <section class="hide" id="dash">
          <div id="cardBody"></div>
          <div id="acctBody"></div>
          <div class="row" style="margin-top:6px;">
            <button class="ghost small block" id="refreshBtn">새로고침</button>
            <button class="ghost small block" id="logoutBtn">로그아웃</button>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    let token = null;

    // API 주소 자동 결정:
    // - 배포처럼 실제 호스트(예: j15b205.p.ssafy.io)에서 서빙되면 같은 오리진의 /api/v1 로
    //   보낸다. Nginx 가 백엔드로 프록시하므로 CORS 가 필요 없다.
    // - 로컬(file:// 로 직접 열거나 정적서버 localhost/127.0.0.1 로 열 때)이면 로컬 백엔드(8080)로.
    function defaultApiBase() {
      const h = location.hostname;
      const isLocal = location.protocol === 'file:' || h === '' || h === 'localhost' || h === '127.0.0.1';
      return isLocal ? 'http://localhost:8080/api/v1' : (location.origin + '/api/v1');
    }
    let apiBase = defaultApiBase();

    // 창 분기: 폰 크기 팝업이거나 작은 창이면 폰 모드(꽉 채움), 큰 창이면 목업 + 팝업 버튼.
    (function routeWindow() {
      if (window.name === 'ssafybank' || window.innerWidth < 520) {
        document.body.classList.add('phone-mode');
      }
      $('openPhone').onclick = () => window.open(location.href, 'ssafybank',
        'width=440,height=900,menubar=no,toolbar=no,location=no,status=no,resizable=yes');
    })();

    const won = (v) => (v == null || v === '') ? '-' : Number(v).toLocaleString('ko-KR') + '원';
    const dt = (d, t) => !d ? '' : `${d.slice(0,4)}.${d.slice(4,6)}.${d.slice(6,8)}` + (t ? ` ${t.slice(0,2)}:${t.slice(2,4)}` : '');
    const fmtCard = (no) => !no ? '' : no.replace(/(\d{4})(?=\d)/g, '$1-');
    const fmtExpiry = (d) => !d ? '' : `${d.slice(2,4)}/${d.slice(4,6)}`;

    async function api(path) {
      const res = await fetch(apiBase + path, { headers: { Authorization: 'Bearer ' + token } });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.success) throw new Error(data?.error?.message || ('HTTP ' + res.status));
      return data.data;
    }
    async function apiPost(path) {
      const res = await fetch(apiBase + path, { method:'POST', headers: { Authorization: 'Bearer ' + token } });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.success) throw new Error(data?.error?.message || ('HTTP ' + res.status));
      return data.data;
    }

    async function login() {
      $('loginErr').textContent = '';
      // 숨은 입력에 값이 있으면(수동 override) 그걸 쓰고, 없으면 자동 결정값 유지.
      const override = $('apiBase').value.trim().replace(/\/$/, '');
      if (override) apiBase = override;
      try {
        const res = await fetch(apiBase + '/auth/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: $('email').value.trim(), password: $('password').value }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.success) throw new Error(data?.error?.message || '로그인 실패');
        token = data.data.accessToken;
        $('who').textContent = (data.data.actor?.name ?? '') + ' 님';
        $('loginCard').classList.add('hide');
        $('dash').classList.remove('hide');
        await refresh();
      } catch (e) {
        $('loginErr').textContent = e.message;
      }
    }
    function logout() {
      token = null;
      $('dash').classList.add('hide');
      $('loginCard').classList.remove('hide');
      $('who').textContent = '';
    }
    async function refresh() { await renderCard(); await renderAccount(); }

    async function renderCard() {
      const box = $('cardBody');
      try {
        const card = await api('/users/me/card');
        if (!card.hasCard) {
          box.innerHTML = `
            <section class="card">
              <h2>내 카드</h2>
              <p class="muted" style="margin:8px 0 16px;">아직 발급된 카드가 없어요. 카드를 발급하면 공구한에서 결제할 수 있어요.</p>
              <button class="block" id="issueBtn">카드 발급받기</button>
              <div class="err" id="issueErr"></div>
            </section>`;
          $('issueBtn').onclick = issueCard;
          return;
        }
        const usage = await api('/users/me/bank/card');
        const rows = (usage.transactions || []).map(t => `
          <div class="tx"><div><div class="t-main">${t.merchantName ?? ''}</div>
          <div class="t-sub">${dt(t.date, t.time)} · ${t.categoryName ?? ''}</div></div>
          <div class="t-amt out">-${won(t.amount)}</div></div>`).join('');
        box.innerHTML = `
          <section class="card">
            <div class="cardface">
              <div class="c-brand">${card.cardIssuerName ?? ''} · ${card.cardName ?? ''}</div>
              <div class="c-no">${fmtCard(card.cardNo)}</div>
              <div class="c-meta"><span>CVC <b>${card.cvc ?? ''}</b></span><span>유효기간 <b>${fmtExpiry(card.cardExpiryDate)}</b></span></div>
            </div>
            <div class="hint">공구한 카드 결제창에 이 번호와 CVC를 입력하세요.</div>
          </section>
          <section class="card">
            <div class="label-s">이번 달 청구 예정</div>
            <div class="amount" style="margin-top:6px;">${won(usage.estimatedBalance)}</div>
            <div style="margin-top:14px;">${rows || '<div class="empty">이용내역이 없어요.</div>'}</div>
          </section>`;
      } catch (e) { box.innerHTML = `<section class="card"><div class="err">${e.message}</div></section>`; }
    }

    async function issueCard() {
      const btn = $('issueBtn');
      if (btn) { btn.disabled = true; btn.textContent = '발급 중…'; }
      try { await apiPost('/users/me/card'); await renderCard(); await renderAccount(); }
      catch (e) { if ($('issueErr')) $('issueErr').textContent = e.message; if (btn) { btn.disabled = false; btn.textContent = '카드 발급받기'; } }
    }

    async function renderAccount() {
      const box = $('acctBody');
      try {
        const a = await api('/users/me/bank/account');
        if (!a.hasAccount) {
          box.innerHTML = `<section class="card"><h2>내 계좌</h2><p class="empty">연결된 계좌가 없어요. 카드 발급 시 자동으로 개설돼요.</p></section>`;
          return;
        }
        const rows = (a.transactions || []).map(t => {
          const isIn = (t.type ?? '').includes('입금');
          return `<div class="tx"><div><div class="t-main">${t.summary ?? t.type ?? ''}</div>
            <div class="t-sub">${dt(t.date, t.time)}</div></div>
            <div class="t-amt ${isIn?'in':'out'}">${isIn?'+':'-'}${won(t.amount)}</div></div>`;
        }).join('');
        box.innerHTML = `
          <section class="card">
            <div class="label-s">SSAFY 계좌 ${a.accountNo ?? ''}</div>
            <div class="amount" style="margin-top:6px;">${won(a.balance)}</div>
            <div style="margin-top:14px;">${rows || '<div class="empty">거래내역이 없어요.</div>'}</div>
          </section>`;
      } catch (e) { box.innerHTML = `<section class="card"><div class="err">${e.message}</div></section>`; }
    }

    $('loginBtn').onclick = login;
    $('refreshBtn').onclick = refresh;
    $('logoutBtn').onclick = logout;
    $('password').addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });
  </script>
</body>
</html>
