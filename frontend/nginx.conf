# 프론트 정적 서빙 + 백엔드 프록시
#
# 프론트는 VITE_API_BASE_URL=/api/v1 로 같은 오리진을 부릅니다. nginx 가 그 경로만
# 백엔드로 넘기면 브라우저 입장에서는 한 서버이므로 CORS 설정이 필요 없습니다.

server {
    listen 80;
    server_name _;

    # 업로드 이미지가 있어 기본값(1M)으로는 막힙니다.
    client_max_body_size 20m;

    # ---------- API ----------
    location /api/v1/ {
        # backend 는 compose 의 서비스 이름입니다.
        proxy_pass http://backend:8080;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 코인 결제는 체인 조회·송금이 끼어 수 초에서 수십 초가 걸립니다.
        # 기본값(60s)이면 환불 송금이 영수증을 기다리는 동안 끊깁니다.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # ---------- 정적 파일 ----------
    location / {
        root /usr/share/nginx/html;

        # SPA 라우팅. /checkout/... 로 새로고침해도 index.html 을 돌려줘야
        # 라우터가 화면을 그립니다. 없으면 404 가 납니다.
        try_files $uri $uri/ /index.html;
    }

    # 해시가 붙은 산출물은 내용이 바뀌면 이름도 바뀌므로 오래 캐시해도 안전합니다.
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
