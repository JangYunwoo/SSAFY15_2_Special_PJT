<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SSAFY 뱅크 · 조회 콘솔</title>
  <style>
    :root { --bg:#0b1b3a; --card:#12264d; --line:#20386b; --txt:#eaf0ff; --sub:#9fb2dd; --pos:#37d67a; --neg:#ff6b6b; --accent:#4c8dff; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--txt); }
    header { padding:16px 20px; background:linear-gradient(90deg,#0b1b3a,#173366); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; }
    header .logo { font-weight:800; font-size:20px; letter-spacing:-.5px; }
    header .badge { font-size:12px; color:var(--sub); border:1px solid var(--line); border-radius:999px; padding:2px 10px; }
    header .who { margin-left:auto; font-size:13px; color:var(--sub); }
    main { max-width:920px; margin:0 auto; padding:20px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; margin-bottom:16px; }
    h2 { margin:0 0 4px; font-size:16px; }
    .muted { color:var(--sub); font-size:13px; }
    input { background:#0c1c3d; border:1px solid var(--line); border-radius:8px; padding:10px 12px; color:var(--txt); font-size:14px; width:100%; }
    label { display:block; font-size:13px; color:var(--sub); margin:10px 0 4px; }
    button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:10px 16px; font-size:14px; font-weight:600; cursor:pointer; }
    button.ghost { background:transparent; border:1px solid var(--line); color:var(--txt); }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    .big { font-size:28px; font-weight:800; letter-spacing:-1px; }
    table { width:100%; border-collapse:collapse; margin-top:10px; font-size:13px; }
    th,td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); }
    th { color:var(--sub); font-weight:600; }
    td.amt { text-align:right; font-variant-numeric:tabular-nums; }
    .in { color:var(--pos); } .out { color:var(--neg); }
    .err { color:var(--neg); font-size:13px; margin-top:8px; }
    .hide { display:none; }
    .pill { font-size:12px; color:var(--sub); }
    .cardface { background:linear-gradient(135deg,#1b3a7a,#2d5bb8); border:1px solid var(--line); border-radius:14px; padding:18px; display:flex; flex-direction:column; gap:10px; }
    .cardface .cardno { font-size:22px; font-weight:700; letter-spacing:2px; font-variant-numeric:tabular-nums; }
    .cardface b { font-weight:700; }
    .cardface .pill { color:#cfe0ff; }
  </style>
</head>
<body>
  <header>
    <span class="logo">🏦 SSAFY 뱅크</span>
    <span class="badge">조회 콘솔 · 시연용</span>
    <span class="who" id="who"></span>
  </header>
  <main>
    <!-- 로그인 -->
    <section class="card" id="loginCard">
      <h2>로그인</h2>
      <p class="muted">공구한 계정으로 로그인하면 그 계정의 카드·계좌를 조회합니다.</p>
      <label>API 주소</label>
      <input id="apiBase" value="http://localhost:8080/api/v1" />
      <label>이메일</label>
      <input id="email" placeholder="you@example.com" autocomplete="username" />
      <label>비밀번호</label>
      <input id="password" type="password" placeholder="비밀번호" autocomplete="current-password" />
      <div class="row" style="margin-top:14px;">
        <button id="loginBtn">로그인</button>
      </div>
      <div class="err" id="loginErr"></div>
    </section>

    <!-- 대시보드 -->
    <section class="hide" id="dash">
      <div class="row" style="margin-bottom:12px;">
        <button id="refreshBtn">🔄 새로고침</button>
        <button class="ghost" id="logoutBtn">로그아웃</button>
        <span class="pill">결제하면 카드에, 환불되면 계좌에 반영됩니다. 새로고침으로 확인하세요.</span>
      </div>

      <!-- 카드 -->
      <section class="card">
        <h2>💳 내 카드</h2>
        <div id="cardBody"><p class="muted">불러오는 중…</p></div>
      </section>

      <!-- 계좌 -->
      <section class="card">
        <h2>🏛️ 내 계좌</h2>
        <div id="acctBody"><p class="muted">불러오는 중…</p></div>
      </section>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    let token = null;
    let apiBase = 'http://localhost:8080/api/v1';

    const won = (v) => (v == null || v === '') ? '-' : Number(v).toLocaleString('ko-KR') + '원';
    const dt = (d, t) => !d ? '' : `${d.slice(0,4)}.${d.slice(4,6)}.${d.slice(6,8)}` + (t ? ` ${t.slice(0,2)}:${t.slice(2,4)}` : '');

    async function api(path) {
      const res = await fetch(apiBase + path, { headers: { Authorization: 'Bearer ' + token } });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.success) throw new Error(data?.error?.message || ('HTTP ' + res.status));
      return data.data;
    }

    async function apiPost(path) {
      const res = await fetch(apiBase + path, {
        method: 'POST', headers: { Authorization: 'Bearer ' + token },
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.success) throw new Error(data?.error?.message || ('HTTP ' + res.status));
      return data.data;
    }

    const fmtCard = (no) => !no ? '' : no.replace(/(\d{4})(?=\d)/g, '$1-');
    const fmtExpiry = (d) => !d ? '' : `${d.slice(2,4)}/${d.slice(4,6)}`; // YYYYMMDD → YY/MM

    async function login() {
      $('loginErr').textContent = '';
      apiBase = $('apiBase').value.trim().replace(/\/$/, '');
      try {
        const res = await fetch(apiBase + '/auth/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: $('email').value.trim(), password: $('password').value }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.success) throw new Error(data?.error?.message || '로그인 실패');
        token = data.data.accessToken;
        $('who').textContent = (data.data.actor?.name ?? '') + ' 님';
        $('loginCard').classList.add('hide');
        $('dash').classList.remove('hide');
        await refresh();
      } catch (e) {
        $('loginErr').textContent = e.message + ' (CORS 오류면 백엔드 로컬 프로파일 CORS 설정을 확인하세요)';
      }
    }

    function logout() {
      token = null;
      $('dash').classList.add('hide');
      $('loginCard').classList.remove('hide');
      $('who').textContent = '';
    }

    async function refresh() {
      renderCard();
      renderAccount();
    }

    async function renderCard() {
      const box = $('cardBody');
      try {
        // 발급 여부와 카드번호·CVC는 /users/me/card 로 확인한다.
        const card = await api('/users/me/card');
        if (!card.hasCard) {
          box.innerHTML = `
            <p class="muted">아직 발급된 카드가 없습니다. 카드를 발급하면 공구한에서 결제할 수 있습니다.</p>
            <button id="issueBtn">카드 발급받기</button>
            <div class="err" id="issueErr"></div>`;
          $('issueBtn').onclick = issueCard;
          return;
        }
        // 카드가 있으면 카드 정보(결제 입력용)와 이용내역(청구예정액)을 함께 보여준다.
        const usage = await api('/users/me/bank/card');
        const rows = (usage.transactions || []).map(t =>
          `<tr><td>${dt(t.date, t.time)}</td><td>${t.merchantName ?? ''}</td><td class="muted">${t.categoryName ?? ''}</td><td class="amt out">-${won(t.amount)}</td></tr>`
        ).join('');
        box.innerHTML = `
          <div class="cardface">
            <div class="muted">${card.cardIssuerName ?? ''} · ${card.cardName ?? ''}</div>
            <div class="cardno">${fmtCard(card.cardNo)}</div>
            <div class="row" style="gap:24px;">
              <span>CVC <b>${card.cvc ?? ''}</b></span>
              <span>유효기간 <b>${fmtExpiry(card.cardExpiryDate)}</b></span>
            </div>
            <div class="pill">💡 공구한 카드 결제창에 이 번호와 CVC를 입력하세요.</div>
          </div>
          <div class="row" style="justify-content:space-between; margin-top:14px;">
            <div class="muted">청구 예정액</div>
            <div class="big">${won(usage.estimatedBalance)}</div>
          </div>
          <table><thead><tr><th>일시</th><th>가맹점</th><th>분류</th><th class="amt">결제액</th></tr></thead>
          <tbody>${rows || '<tr><td colspan="4" class="muted">이용내역이 없습니다.</td></tr>'}</tbody></table>`;
      } catch (e) { box.innerHTML = `<p class="err">${e.message}</p>`; }
    }

    async function issueCard() {
      const btn = $('issueBtn');
      if (btn) { btn.disabled = true; btn.textContent = '발급 중…'; }
      try {
        await apiPost('/users/me/card'); // 계좌 없으면 자동 개설 후 발급
        await renderCard();
        renderAccount(); // 자동 개설된 계좌가 계좌 섹션에도 반영되도록 갱신
      } catch (e) {
        if ($('issueErr')) $('issueErr').textContent = e.message;
        if (btn) { btn.disabled = false; btn.textContent = '카드 발급받기'; }
      }
    }

    async function renderAccount() {
      const box = $('acctBody');
      try {
        const a = await api('/users/me/bank/account');
        if (!a.hasAccount) { box.innerHTML = '<p class="muted">연결된 정산 계좌가 없습니다. 카드 발급/판매자 전환 시 개설됩니다.</p>'; return; }
        const rows = (a.transactions || []).map(t => {
          const isIn = (t.type ?? '').includes('입금');
          return `<tr><td>${dt(t.date, t.time)}</td><td>${t.summary ?? t.type ?? ''}</td><td class="amt ${isIn?'in':'out'}">${isIn?'+':'-'}${won(t.amount)}</td><td class="amt muted">${won(t.afterBalance)}</td></tr>`;
        }).join('');
        box.innerHTML = `
          <div class="row" style="justify-content:space-between;">
            <div><div class="muted">계좌번호 ${a.accountNo ?? ''}</div><div class="muted">잔액</div></div>
            <div class="big">${won(a.balance)}</div>
          </div>
          <table><thead><tr><th>일시</th><th>내용</th><th class="amt">금액</th><th class="amt">잔액</th></tr></thead>
          <tbody>${rows || '<tr><td colspan="4" class="muted">거래내역이 없습니다.</td></tr>'}</tbody></table>`;
      } catch (e) { box.innerHTML = `<p class="err">${e.message}</p>`; }
    }

    $('loginBtn').onclick = login;
    $('refreshBtn').onclick = refresh;
    $('logoutBtn').onclick = logout;
    $('password').addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });
  </script>
</body>
</html>
