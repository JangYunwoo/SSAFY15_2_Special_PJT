springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

app:
  slot-gate:
    # 로컬은 단일 인스턴스이므로 Redis 없이도 결제 시나리오를 점검할 수 있다.
    # 배포 환경은 이 값을 켜지 않고 Redis Lua 원자성을 사용한다.
    local-fallback-enabled: true
  # 로컬 전용 CORS. 공구한 프론트(5173)에 더해 시연용 "가상 은행 콘솔"을 허용한다.
  # 콘솔은 별도 단일 HTML 파일이라, 정적 서버(8090)로 열거나 파일을 직접 열면(Origin: null)
  # 된다. 인증은 Authorization 헤더(쿠키 아님)라 allowCredentials가 필요 없어 안전하다.
  # 운영 프로파일에는 이 설정이 없어 반영되지 않는다.
  cors:
    # @Value List<String>는 콤마구분 문자열을 파싱한다(YAML 시퀀스가 아님). "null"은 file:// 오리진.
    allowed-origins: "http://localhost:5173,http://localhost:8090,http://127.0.0.1:8090,null"
