# 공구한 프로덕션 Nginx — 유일한 공개 진입점.
#
# 역할:
#   1) 정적 SPA(React 빌드 산출물) 서빙
#   2) /api/ 요청을 백엔드 컨테이너로 리버스 프록시(같은 오리진 → 브라우저 CORS 불필요)
#   3) TLS 종료(HTTPS) 및 HTTP→HTTPS 강제
#   4) 보안 헤더 부착
#
# 백엔드/AI/DB 컨테이너는 호스트로 포트를 열지 않는다. 오직 이 Nginx 만 80/443 을 공개한다.

# 백엔드 업스트림(도커 네트워크 내부 DNS: 서비스명 'backend' 로 해석).
upstream backend_upstream {
    server backend:8080;
    keepalive 32;
}

# ---- HTTP(80): ACME(인증서 발급) 챌린지 통과 + 나머지는 HTTPS 로 강제 ----
server {
    listen 80;
    listen [::]:80;
    server_name j15b205.p.ssafy.io;

    # Let's Encrypt HTTP-01 챌린지 경로만 평문으로 응답.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS(443): 실제 서비스 ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name j15b205.p.ssafy.io;

    # certbot 이 발급한 인증서(컨테이너에 볼륨 마운트). 발급 전에는 자체서명으로 임시 기동 가능.
    ssl_certificate     /etc/letsencrypt/live/j15b205.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/j15b205.p.ssafy.io/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 상품 이미지 멀티파트 업로드 한도(백엔드 max-request-size 30MB 와 맞춤).
    client_max_body_size 30m;

    # 보안 헤더.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 백엔드 API 프록시. 백엔드 context-path 가 /api/v1 이므로 경로를 그대로 넘긴다.
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        # 카카오페이 리다이렉트/외부 결제 콜백 대비 넉넉한 타임아웃.
        proxy_read_timeout 60s;
    }

    # SPA 정적 파일. 클라이언트 라우팅(react-router)을 위해 없는 경로는 index.html 로 폴백.
    root /usr/share/nginx/html;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 해시된 정적 에셋은 장기 캐시.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
