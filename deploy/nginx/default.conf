# 공구한 프로덕션 Nginx — 유일한 공개 진입점.
#
# 역할:
#   1) 정적 SPA(React 빌드 산출물) 서빙
#   2) /api/ 요청을 백엔드 컨테이너로 리버스 프록시(같은 오리진 → 브라우저 CORS 불필요)
#   3) TLS 종료(HTTPS) 및 HTTP→HTTPS 강제
#   4) 보안 헤더 부착
#
# 백엔드/AI/DB 컨테이너는 호스트로 포트를 열지 않는다. 오직 이 Nginx 만 80/443 을 공개한다.

# 백엔드 업스트림(도커 네트워크 내부 DNS: 서비스명 'backend' 로 해석).
upstream backend_upstream {
    server backend:8080;
    keepalive 32;
}

# ---- HTTP(80): ACME(인증서 발급) 챌린지 통과 + 나머지는 HTTPS 로 강제 ----
server {
    listen 80;
    listen [::]:80;
    server_name j15b205.p.ssafy.io;

    # Let's Encrypt HTTP-01 챌린지 경로만 평문으로 응답.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS(443): 실제 서비스 ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name j15b205.p.ssafy.io;

    # certbot 이 발급한 인증서(컨테이너에 볼륨 마운트). 발급 전에는 자체서명으로 임시 기동 가능.
    ssl_certificate     /etc/letsencrypt/live/j15b205.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/j15b205.p.ssafy.io/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 상품 이미지 멀티파트 업로드 한도(백엔드 max-request-size 30MB 와 맞춤).
    client_max_body_size 30m;

    # 보안 헤더.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 백엔드 API 프록시. 백엔드 context-path 가 /api/v1 이므로 경로를 그대로 넘긴다.
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        # 카카오페이 리다이렉트/외부 결제 콜백, 그리고 AI 상품정보 추출
        # (/sellers/products/ai-extraction) 대비 넉넉한 타임아웃.
        #
        # Gemini 분석 실측이 이미지 1장에 62~63초다. 60초로는 백엔드가 아직 기다리는
        # 중인데 nginx 가 먼저 끊어, 백엔드 타임아웃만 올려도 사용자 화면은 그대로
        # 실패한다. 둘 다 실측보다 길어야 한다.
        #
        # 이 경로에만 따로 location 을 두지 않는 이유는, 위의 proxy_set_header 다섯 줄을
        # 복제해야 하고 한쪽만 고치면 인증 헤더가 조용히 빠지기 때문이다. 대신 모든
        # API 가 최대 120초까지 매달릴 수 있음을 감수한다.
        proxy_read_timeout 120s;
    }

    # SPA 정적 파일. 클라이언트 라우팅(react-router)을 위해 없는 경로는 index.html 로 폴백.
    root /usr/share/nginx/html;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 은 캐시하지 않는다.
    #
    # 배포마다 참조하는 에셋 파일명(해시)이 바뀌는데, 브라우저가 옛 index.html 을
    # 들고 있으면 사라진 파일명을 요청해 404 가 난다. 라우트를 lazy 로 불러오는
    # 화면(상품 상세 등)은 그대로 뜨지 않는다. Cache-Control 이 없으면 브라우저가
    # Last-Modified 기준 휴리스틱으로 알아서 캐시하므로 명시해야 한다.
    #
    # add_header 는 하위 블록에 하나라도 있으면 상위 것을 물려주지 않는다.
    # 그래서 server 블록의 보안 헤더를 여기서 다시 적는다.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # 해시된 정적 에셋은 장기 캐시. 파일명이 내용마다 달라 오래 두어도 안전하다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # 위와 같은 이유로 보안 헤더를 다시 적는다. 특히 nosniff 는 스크립트에 필요하다.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}
