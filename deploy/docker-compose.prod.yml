# 공구한 프로덕션 오케스트레이션 (단일 EC2).
#
# 설계 원칙:
#   * 공개 진입점은 nginx(frontend) 하나뿐. 80/443 만 호스트로 publish 한다.
#   * backend / ai / mysql / redis 는 'ports:' 를 쓰지 않는다 → 호스트에 노출되지 않고
#     도커 내부 네트워크(gongguhan-net)에서 서비스명으로만 통신한다.
#     (도커가 iptables 를 직접 만져 UFW 를 우회하는 문제를 원천 차단하는 핵심 결정.)
#   * 비밀값은 이미지에 넣지 않고 env_file / 볼륨 마운트로 런타임에 주입한다.
#
# 실행: deploy/ 디렉터리에서
#   docker compose -f docker-compose.prod.yml up -d --build

name: gongguhan-prod

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    env_file: ./env/mysql.env
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00
    volumes:
      - mysql-data:/var/lib/mysql
    networks: [gongguhan-net]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks: [gongguhan-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: ../deploy/backend.Dockerfile
    restart: unless-stopped
    env_file: ./env/backend.env
    environment:
      # prod 프로파일 → application-local.yml(스웨거·CORS 허용·슬롯게이트 로컬폴백) 미로딩.
      SPRING_PROFILES_ACTIVE: prod
      # SSAFY 금융망은 전송시각(전송일자+시각)이 KST 기준이어야 한다. 컨테이너 기본 UTC 로 두면
      # LocalDateTime.now() 가 9시간 어긋나 H1003(전송시각 형식 오류)로 거부된다. 반드시 KST.
      TZ: Asia/Seoul
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Seoul
      # 컨테이너 내부 DNS 로 인프라 접근(호스트/localhost 아님).
      DB_URL: jdbc:mysql://mysql:3306/gongguhan?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      REDIS_HOST: redis
      # 백엔드 → AI 서비스도 내부 네트워크로.
      AI_EXTRACTION_BASE_URL: http://ai:8000
      RECOMMENDATION_AI_BASE_URL: http://ai:8000
      # Gemini 멀티모달 이미지 분석 실측이 이미지 1장에 62~63초다(운영 AI 컨테이너에서
      # 같은 호출을 재현해 측정). 30초로는 백엔드가 먼저 끊고, 그 직후 finally 가
      # 분석용 임시 이미지를 S3 에서 지워, 뒤늦게 URL 을 가져가는 Gemini 가 400 을
      # 받는다. 로그의 "Gemini URL 분석 요청 실패: HTTP 400" 은 원인이 아니라 그 결과다.
      # 90초는 실측 + 이미지 여러 장과 시세 변동을 감안한 여유다.
      AI_EXTRACTION_TIMEOUT_MS: "90000"
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [gongguhan-net]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  ai:
    build:
      context: ../ai
      dockerfile: ../deploy/ai.Dockerfile
    restart: unless-stopped
    env_file: ./env/ai.env
    environment:
      # Vertex AI(Gemini) 인증용 서비스계정 키. 아래 볼륨으로 마운트한 경로를 가리킨다.
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/gcp-sa.json
    volumes:
      # 호스트의 실제 키 파일을 읽기전용으로 마운트(이미지·git 에 절대 넣지 않음).
      - ./secrets/gcp-sa.json:/secrets/gcp-sa.json:ro
    networks: [gongguhan-net]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  nginx:
    build:
      context: ../frontend
      dockerfile: ../deploy/frontend.Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-certs:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot
    depends_on: [backend]
    networks: [gongguhan-net]

  # 인증서 발급/갱신 전용(평소엔 idle). 발급·갱신 절차는 deploy/README.md 참고.
  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot-certs:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"]
    networks: [gongguhan-net]

networks:
  gongguhan-net:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  certbot-certs:
  certbot-webroot:
